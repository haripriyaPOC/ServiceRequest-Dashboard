apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-dashboard-deployment
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-dashboard-container
          image: haripriya1310/dashboard-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
